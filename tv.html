<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM TV Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        .full-screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #player {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            transform: scale(1.35); /* Elimina bordes negros */
        }
        .standby {
            background: linear-gradient(135deg, #0b0e14, #040508);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #00d2ff;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        .subtext {
            font-size: 14px;
            color: #7a7a95;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Standby -->
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
    </div>

    <!-- Contenedor del Reproductor -->
    <div id="playerContainer" class="full-screen" style="display: none;">
        <div id="player-wrapper">
            <div id="player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player = null;
        let apiReady = false;
        let currentVolume = 100;

        function onYouTubeIframeAPIReady() {
            apiReady = true;
        }

        function loadVideo(videoId) {
            document.getElementById('standbyScreen').style.display = 'none';
            document.getElementById('playerContainer').style.display = 'block';

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
                player.setVolume(currentVolume);
                player.unMute();
            } else {
                document.getElementById('player-wrapper').innerHTML = '<div id="player"></div>';
                
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'controls': 0,
                        'mute': 0,
                        'enablejsapi': 1,
                        'rel': 0,
                        'iv_load_policy': 3,
                        'modestbranding': 1
                    },
                    events: {
                        'onReady': (event) => {
                            event.target.setVolume(currentVolume);
                            event.target.playVideo();
                            event.target.unMute();
                        },
                        'onStateChange': (event) => {
                            // Si el vídeo termina (estado 0), vuelve al standby automáticamente
                            if (event.data === 0) {
                                showStandby();
                            }
                        }
                    }
                });
            }
        }

        function showStandby() {
            if (player) {
                try {
                    player.stopVideo();
                    player.destroy();
                } catch (e) {}
                player = null;
            }
            document.getElementById('playerContainer').style.display = 'none';
            document.getElementById('standbyScreen').style.display = 'flex';
        }

        window.addEventListener('message', function (event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo" && data.videoId) {
                if (apiReady) {
                    loadVideo(data.videoId);
                } else {
                    let check = setInterval(() => {
                        if (apiReady) {
                            clearInterval(check);
                            loadVideo(data.videoId);
                        }
                    }, 200);
                }
            } else if (data.type === "standby") {
                showStandby();
            } else if (data.type === "setVolume") {
                currentVolume = Number(data.volume) || 0;
                if (player && typeof player.setVolume === 'function') {
                    player.setVolume(currentVolume);
                }
            } else if (data.type === "pause") {
                if (player && typeof player.getPlayerState === 'function') {
                    if (player.getPlayerState() === 1) {
                        player.pauseVideo();
                    } else {
                        player.playVideo();
                    }
                }
            }
        });
    </script>
</body>
</html>
