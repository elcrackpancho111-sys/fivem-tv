<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM Piped Native TV Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        .full-screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
        }
        .standby {
            background: linear-gradient(135deg, #0b0e14, #040508);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #00d2ff;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        .subtext {
            font-size: 14px;
            color: #7a7a95;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }
        #logStatus {
            font-size: 12px;
            color: #ff5555;
            margin-top: 15px;
            font-family: monospace;
            max-width: 800px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Standby / Depuración -->
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext" id="mainStatusText">SEÑAL ESTABLECIDA</div>
        <div id="logStatus">Esperando órdenes...</div>
    </div>

    <!-- Contenedor del vídeo nativo -->
    <div id="playerContainer" class="full-screen" style="display: none;">
        <video id="nativeVideo" autoplay playsinline></video>
    </div>

    <script>
        const standbyScreen = document.getElementById('standbyScreen');
        const playerContainer = document.getElementById('playerContainer');
        const videoEl = document.getElementById('nativeVideo');
        const mainStatusText = document.getElementById('mainStatusText');
        const logStatus = document.getElementById('logStatus');
        let currentVolume = 1.0;

        const pipedInstances = [
            "https://pipedapi.kavin.rocks/streams/",
            "https://pipedapi.privacy.com.de/streams/",
            "https://pipedapi.drgns.space/streams/"
        ];

        function updateLog(text, isError = false) {
            console.log("[DUI LOG] " + text);
            logStatus.innerText = text;
            logStatus.style.color = isError ? "#ff5555" : "#00ffcc";
        }

        async function loadVideo(videoId) {
            updateLog(`Cargando ID: ${videoId}...`);
            standbyScreen.style.display = 'flex';
            playerContainer.style.display = 'none';
            mainStatusText.innerText = "BUSCANDO STREAM LIMPIO...";

            let streamUrl = null;

            for (let i = 0; i < pipedInstances.length; i++) {
                try {
                    let targetUrl = pipedInstances[i] + videoId;
                    updateLog(`Probando instancia [${i}]: ${targetUrl}`);
                    
                    let response = await fetch(targetUrl);
                    if (response.ok) {
                        let data = await response.json();
                        let stream = data.videoStreams?.find(s => s.url && s.videoOnly === false) || data.videoStreams?.[0];
                        if (stream && stream.url) {
                            streamUrl = stream.url;
                            updateLog(`¡Stream obtenido con éxito en instancia [${i}]!`);
                            break;
                        } else {
                            updateLog(`Instancia [${i}] respondió pero sin streams válidos.`, true);
                        }
                    } else {
                        updateLog(`Instancia [${i}] falló con código HTTP: ${response.status}`, true);
                    }
                } catch (e) {
                    updateLog(`Excepción en instancia [${i}]: ${e.message}`, true);
                }
            }

            if (streamUrl) {
                standbyScreen.style.display = 'none';
                playerContainer.style.display = 'block';
                videoEl.src = streamUrl;
                videoEl.volume = currentVolume;
                videoEl.play().catch(err => {
                    updateLog(`Error al reproducir elemento video: ${err.message}`, true);
                });
            } else {
                mainStatusText.innerText = "ERROR: TODAS LAS INSTANCIAS FALLARON";
                updateLog("No se pudo obtener el vídeo de ninguna API de Piped.", true);
            }
        }

        function stopVideo() {
            updateLog("Deteniendo reproducción...");
            videoEl.pause();
            videoEl.src = '';
            playerContainer.style.display = 'none';
            standbyScreen.style.display = 'flex';
            mainStatusText.innerText = "SEÑAL ESTABLECIDA";
        }

        videoEl.addEventListener('ended', function() {
            updateLog("El vídeo finalizó.");
            stopVideo();
        });

        window.addEventListener('message', function (event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo" && data.videoId) {
                loadVideo(data.videoId);
            } else if (data.type === "standby") {
                stopVideo();
            } else if (data.type === "setVolume") {
                currentVolume = (Number(data.volume) || 0) / 100;
                videoEl.volume = currentVolume;
            } else if (data.type === "pause") {
                if (videoEl.paused) {
                    videoEl.play();
                } else {
                    videoEl.pause();
                }
            }
        });
    </script>
</body>
</html>
