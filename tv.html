<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM TV Player - AdFree</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; background-color: #000; }
        body, html { width: 100%; height: 100%; background: #000; }
        .full-screen { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center; }
        #player-wrapper { width: 100vw; height: 100vh; position: relative; }
        
        .standby { background: linear-gradient(135deg, #0b0e14, #040508); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; flex-direction: column; }
        .logo { font-size: 48px; font-weight: 800; letter-spacing: 6px; color: #00d2ff; text-shadow: 0 0 25px rgba(0, 210, 255, 0.6); margin-bottom: 8px; }
        .subtext { font-size: 14px; color: #7a7a95; letter-spacing: 4px; text-transform: uppercase; }
        .pulse { width: 12px; height: 12px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 15px #00ff88; margin-top: 30px; animation: pulseAnim 2s infinite ease-in-out; }
        @keyframes pulseAnim { 0% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(0.8); } }
    </style>
</head>
<body>
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
        <div class="pulse"></div>
    </div>
    <div id="playerContainer" class="full-screen" style="display: none;">
        <div id="player-wrapper">
            <!-- El video HTML5 se inyectará aquí -->
        </div>
    </div>

    <script>
        let localPlayer = null;
        let currentVolume = 1.0; // En HTML5 el volumen va de 0.0 a 1.0

        async function loadAdFreeVideo(videoId, startSeconds = 0) {
            const standbyScreen = document.getElementById('standbyScreen');
            const playerContainer = document.getElementById('playerContainer');
            const wrapper = document.getElementById('player-wrapper');

            standbyScreen.style.display = 'none';
            playerContainer.style.display = 'block';

            try {
                // Usar la API de Yewtu.be (instancia Invidious) para sacar el MP4 directo
                const response = await fetch(`https://yewtu.be/api/v1/videos/${videoId}`);
                const data = await response.json();
                
                let streamUrl = "";
                // Extraemos la primera URL de stream (MP4) válida
                if (data.formatStreams && data.formatStreams.length > 0) {
                    streamUrl = data.formatStreams[0].url;
                } else {
                    throw new Error("No se encontraron streams válidos");
                }

                wrapper.innerHTML = `<video id="htmlPlayer" style="width: 100vw; height: 100vh; object-fit: cover; transform: scale(1.05);"></video>`;
                localPlayer = document.getElementById('htmlPlayer');
                
                localPlayer.src = streamUrl;
                localPlayer.currentTime = startSeconds;
                localPlayer.volume = currentVolume;
                
                // Si el video termina, volver a Standby
                localPlayer.onended = () => { showStandby(); };
                
                // Forzar reproducción
                let playPromise = localPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log("Reproducción automática bloqueada:", e));
                }
            } catch (error) {
                console.error("Error cargando video sin anuncios:", error);
                showStandby();
            }
        }

        function showStandby() {
            const standbyScreen = document.getElementById('standbyScreen');
            const playerContainer = document.getElementById('playerContainer');
            
            if (localPlayer) {
                localPlayer.pause();
                localPlayer.removeAttribute('src');
                localPlayer.load();
                localPlayer = null;
            }
            
            playerContainer.style.display = 'none';
            standbyScreen.style.display = 'flex';
        }

        window.addEventListener('message', function(event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo") {
                loadAdFreeVideo(data.videoId, data.startSeconds);
            } else if (data.type === "standby") {
                showStandby();
            } else if (data.type === "setVolume") {
                // Convertir de 0-100 (FiveM) a 0.0-1.0 (HTML5)
                currentVolume = (Number(data.volume) || 0) / 100;
                if (localPlayer) localPlayer.volume = currentVolume;
            } else if (data.type === "pause") {
                if (localPlayer) {
                    if (localPlayer.paused) localPlayer.play();
                    else localPlayer.pause();
                }
            }
        });
    </script>
</body>
</html>
