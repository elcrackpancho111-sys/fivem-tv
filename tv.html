<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM Piped TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <!-- El iframe se cargará dinámicamente al recibir la URL -->
        <iframe id="pipedFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        // Función inteligente para extraer el ID de YouTube desde cualquier formato de enlace
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        // Escucha las peticiones enviadas desde el cliente de FiveM (Lua)
        window.addEventListener('message', function (event) {
            const data = event.data;
            const iframe = document.getElementById('pipedFrame');

            // Detecta cuando se manda a reproducir un vídeo (ajústalo según las variables de tu script Lua: data.url, data.link, etc.)
            if (data.type === 'play' || data.url || data.link) {
                const videoUrl = data.url || data.link || data.video;
                const videoId = extractYouTubeId(videoUrl);
                
                if (videoId) {
                    // Carga la instancia de Piped pasando el ID y ordenando la reproducción automática
                    iframe.src = `https://piped.video/embed/${videoId}?autoplay=true`;
                }
            } 
            // Detecta si se apaga la televisión o se detiene el vídeo
            else if (data.type === 'stop' || data.type === 'close') {
                iframe.src = ''; // Limpia el reproductor para detener el audio y vídeo
            }
        });
    </script>
</body>
</html>
