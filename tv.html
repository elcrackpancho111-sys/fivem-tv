<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM Piped TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        .full-screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        .standby {
            background: linear-gradient(135deg, #0b0e14, #040508);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #00d2ff;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        .subtext {
            font-size: 14px;
            color: #7a7a95;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Standby -->
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
    </div>

    <!-- Contenedor del reproductor Piped -->
    <div id="playerContainer" class="full-screen" style="display: none;">
        <iframe id="pipedFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const standbyScreen = document.getElementById('standbyScreen');
        const playerContainer = document.getElementById('playerContainer');
        const pipedFrame = document.getElementById('pipedFrame');

        window.addEventListener('message', function (event) {
            let data = event.data;
            if (!data) return;

            // Recibe la orden de cargar vídeo enviada desde client.lua
            if (data.type === "loadVideo" && data.videoId) {
                standbyScreen.style.display = 'none';
                playerContainer.style.display = 'block';
                // Carga la instancia de Piped libre de anuncios con el ID extraído
                pipedFrame.src = `https://piped.video/embed/${data.videoId}?autoplay=1`;
            } 
            // Recibe la orden de detener o apagar (Standby)
            else if (data.type === "standby") {
                pipedFrame.src = ''; // Limpia el iframe para cortar el audio de raíz
                playerContainer.style.display = 'none';
                standbyScreen.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
