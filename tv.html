<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM Piped Native TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        .full-screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
        }
        .standby {
            background: linear-gradient(135deg, #0b0e14, #040508);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #00d2ff;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        .subtext {
            font-size: 14px;
            color: #7a7a95;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Standby -->
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
    </div>

    <!-- Contenedor del vídeo nativo -->
    <div id="playerContainer" class="full-screen" style="display: none;">
        <video id="nativeVideo" autoplay playsinline></video>
    </div>

    <script>
        const standbyScreen = document.getElementById('standbyScreen');
        const playerContainer = document.getElementById('playerContainer');
        const videoEl = document.getElementById('nativeVideo');
        let currentVolume = 1.0;

        // Lista de servidores de respaldo oficiales de Piped (si uno falla, prueba el siguiente)
        const pipedInstances = [
            "https://pipedapi.kavin.rocks/streams/",
            "https://pipedapi.privacy.com.de/streams/",
            "https://pipedapi.drgns.space/streams/"
        ];

        async function loadVideo(videoId) {
            standbyScreen.style.display = 'none';
            playerContainer.style.display = 'block';

            let streamUrl = null;

            // Intentar conectar con las diferentes instancias hasta que una responda con éxito
            for (let i = 0; i < pipedInstances.length; i++) {
                try {
                    let response = await fetch(pipedInstances[i] + videoId);
                    if (response.ok) {
                        let data = await response.json();
                        // Buscar un flujo que combine vídeo y audio limpios de anuncios
                        let stream = data.videoStreams?.find(s => s.url && s.videoOnly === false) || data.videoStreams?.[0];
                        if (stream && stream.url) {
                            streamUrl = stream.url;
                            break; // ¡Encontrado! Salimos del bucle
                        }
                    }
                } catch (e) {
                    console.log(`Instancia ${i} falló, intentando siguiente...`);
                }
            }

            if (streamUrl) {
                videoEl.src = streamUrl;
                videoEl.volume = currentVolume;
                videoEl.play().catch(err => console.log("Error al reproducir el stream:", err));
            } else {
                console.error("Todas las instancias de Piped fallaron para este vídeo.");
                stopVideo();
            }
        }

        function stopVideo() {
            videoEl.pause();
            videoEl.src = '';
            playerContainer.style.display = 'none';
            standbyScreen.style.display = 'flex';
        }

        // Detectar cuando el vídeo termina de forma nativa para volver al standby
        videoEl.addEventListener('ended', function() {
            stopVideo();
        });

        // Receptor de mensajes de FiveM (cliente Lua)
        window.addEventListener('message', function (event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo" && data.videoId) {
                loadVideo(data.videoId);
            } else if (data.type === "standby") {
                stopVideo();
            } else if (data.type === "setVolume") {
                // FiveM envía de 0 a 100, la etiqueta video requiere de 0.0 a 1.0
                currentVolume = (Number(data.volume) || 0) / 100;
                videoEl.volume = currentVolume;
            } else if (data.type === "pause") {
                if (videoEl.paused) {
                    videoEl.play();
                } else {
                    videoEl.pause();
                }
            }
        });
    </script>
</body>
</html>
