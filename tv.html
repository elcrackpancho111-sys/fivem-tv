<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FiveM Native Piped TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        .full-screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
        }
        .standby {
            background: linear-gradient(135deg, #0b0e14, #040508);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #00d2ff;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        .subtext {
            font-size: 14px;
            color: #7a7a95;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Standby -->
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
    </div>

    <!-- Contenedor del vídeo nativo -->
    <div id="playerContainer" class="full-screen" style="display: none;">
        <video id="nativeVideo" autoplay playsinline></video>
    </div>

    <script>
        const standbyScreen = document.getElementById('standbyScreen');
        const playerContainer = document.getElementById('playerContainer');
        const videoEl = document.getElementById('nativeVideo');
        let currentVolume = 1.0;

        async function loadVideo(videoId) {
            try {
                standbyScreen.style.display = 'none';
                playerContainer.style.display = 'block';

                // Consultamos la API pública de Piped para extraer el stream limpio de anuncios
                let response = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                let data = await response.json();

                // Buscamos un formato de vídeo que incluya audio y vídeo combinados
                let stream = data.videoStreams.find(s => s.url && s.videoOnly === false) || data.videoStreams[0];

                if (stream && stream.url) {
                    videoEl.src = stream.url;
                    videoEl.volume = currentVolume;
                    videoEl.play();
                } else {
                    console.error("No se encontró un enlace de stream válido.");
                }
            } catch (e) {
                console.error("Error al conectar con la API de Piped:", e);
            }
        }

        function stopVideo() {
            videoEl.pause();
            videoEl.src = '';
            playerContainer.style.display = 'none';
            standbyScreen.style.display = 'flex';
        }

        // Detectar cuando el vídeo termina de forma nativa para volver al standby
        videoEl.addEventListener('ended', function() {
            stopVideo();
        });

        // Receptor de mensajes de FiveM
        window.addEventListener('message', function (event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo" && data.videoId) {
                loadVideo(data.videoId);
            } else if (data.type === "standby") {
                stopVideo();
            } else if (data.type === "setVolume") {
                // FiveM envía de 0 a 100, la etiqueta video requiere de 0.0 a 1.0
                currentVolume = (Number(data.volume) || 0) / 100;
                videoEl.volume = currentVolume;
            } else if (data.type === "pause") {
                if (videoEl.paused) {
                    videoEl.play();
                } else {
                    videoEl.pause();
                }
            }
        });
    </script>
</body>
</html>
