<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM TV Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; background-color: #000; }
        body, html { width: 100%; height: 100%; background: #000; }
        .full-screen { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center; }
        #player-wrapper { width: 100vw; height: 100vh; position: relative; pointer-events: none; }
        
        .standby { background: linear-gradient(135deg, #0b0e14, #040508); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; flex-direction: column; }
        .logo { font-size: 48px; font-weight: 800; letter-spacing: 6px; color: #00d2ff; text-shadow: 0 0 25px rgba(0, 210, 255, 0.6); margin-bottom: 8px; }
        .subtext { font-size: 14px; color: #7a7a95; letter-spacing: 4px; text-transform: uppercase; }
        .pulse { width: 12px; height: 12px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 15px #00ff88; margin-top: 30px; animation: pulseAnim 2s infinite ease-in-out; }
        @keyframes pulseAnim { 0% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(0.8); } }
    </style>
</head>
<body>
    <div id="standbyScreen" class="full-screen standby">
        <div class="logo">SMART TV</div>
        <div class="subtext">SEÑAL ESTABLECIDA</div>
        <div class="pulse"></div>
    </div>
    <div id="playerContainer" class="full-screen" style="display: none;">
        <div id="player-wrapper">
            <div id="youtube-player"></div>
        </div>
    </div>

    <!-- API Oficial de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let pendingVideoId = null;
        let pendingStartSeconds = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            if (pendingVideoId) {
                player.loadVideoById({videoId: pendingVideoId, startSeconds: pendingStartSeconds});
                pendingVideoId = null;
            }
        }

        function playYouTubeVideo(videoId, startSeconds = 0) {
            const standbyScreen = document.getElementById('standbyScreen');
            const playerContainer = document.getElementById('playerContainer');

            standbyScreen.style.display = 'none';
            playerContainer.style.display = 'block';

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById({videoId: videoId, startSeconds: startSeconds});
            } else {
                pendingVideoId = videoId;
                pendingStartSeconds = startSeconds;
            }
        }

        function showStandby() {
            const standbyScreen = document.getElementById('standbyScreen');
            const playerContainer = document.getElementById('playerContainer');
            
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            
            playerContainer.style.display = 'none';
            standbyScreen.style.display = 'flex';
        }

        window.addEventListener('message', function(event) {
            let data = event.data;
            if (!data) return;

            if (data.type === "loadVideo") {
                playYouTubeVideo(data.videoId, data.startSeconds);
            } else if (data.type === "standby") {
                showStandby();
            } else if (data.type === "setVolume") {
                if (player && typeof player.setVolume === 'function') {
                    player.setVolume(Number(data.volume) || 0);
                }
            } else if (data.type === "pause") {
                if (player && typeof player.getPlayerState === 'function') {
                    let state = player.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    } else {
                        player.playVideo();
                    }
                }
            }
        });
    </script>
</body>
</html>
